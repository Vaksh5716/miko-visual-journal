name: Publish Miko Atelier
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: miko-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
